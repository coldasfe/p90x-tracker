function fresh(id){return{id:Date.now(),workout:id,date:new Date().toISOString(),entries:{}}}

function priorFor(workoutId,k,date,id){
 return history.filter(w=>w.workout===workoutId && w.id!==id && new Date(w.date)<new Date(date) && w.entries?.[k]?.reps)
 .sort((a,b)=>new Date(b.date)-new Date(a.date))[0]?.entries[k]||null}

   if(type==="pushvar")out+=`<div class="grow"><label>Variation</label><select onchange="setv('${k}','variation',this.value)">${["Clap","Plyo"].map(v=>`<option ${e.variation===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="grow"><label>Style</label><select onchange="setv('${k}','mod',this.value)">${["Standard","Modified","Skipped"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
   if(type==="maxpull")out+=`<div class="grow"><label>Style</label><select onchange="setv('${k}','variation',this.value)">${["Standard","Wide","Chin-Up","Corn Cob"].map(v=>`<option ${e.variation===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="grow"><label>Assistance</label><select onchange="setv('${k}','mod',this.value)">${["None","Chair","Band"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
   if(type==="plankvar")out+=`<div class="grow"><label>Variation</label><select onchange="setv('${k}','mod',this.value)">${["Plank","Plank / Chaturanga"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
   if(type==="modtime")out+=`<div class="grow"><label>Style</label><select onchange="setv('${k}','mod',this.value)">${["Standard","Modified"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
   out+=`</div>`;
 }
 out+=`<div style="margin-top:9px"><label>Quick note</label><textarea placeholder="Optional…" onchange="setv('${k}','note',this.value)">${e.note||""}</textarea></div></section>`;
 return out;
}
function setStrip(k,i,f,v){current.entries[k]=current.entries[k]||{};current.entries[k].strips=current.entries[k].strips||[{weight:"",reps:"8"},{weight:"",reps:"8"},{weight:"",reps:"8"},{weight:"",reps:"8"}];current.entries[k].strips[i][f]=v;current.entries[k].reps="8";autosave()}

function renderWorkout(){
 let w=workouts[active];document.getElementById("title").textContent=w.name;document.getElementById("subtitle").textContent=fmtDate(current.date);document.getElementById("saveBtn").classList.remove("hidden");let out="";
 if(w.sequence){
   w.sequence.forEach((ex,i)=>{out+=exerciseCard(`s-${i}`,ex,i+1)});
   if(w.bonus){let yes=current.bonus===true;out+=bonusChoice();if(yes){out+=`<div class="round">BONUS ROUND</div>`;w.bonus.forEach((ex,i)=>out+=exerciseCard(`bonus-${i}`,ex,i+1))}}
 }else if(w.groups){
   w.groups.forEach((g,gi)=>{out+=`<div class="round">${g.label}</div>`;g.ex.forEach((ex,i)=>{out+=exerciseCard(`g${gi}-${i}`,ex,i+1)})});
   if(w.bonusGroups){let yes=current.bonus===true;out+=bonusChoice();if(yes)w.bonusGroups.forEach((g,gi)=>{out+=`<div class="round">${g.label}</div>`;g.ex.forEach((ex,i)=>out+=exerciseCard(`bg${gi}-${i}`,ex,i+1))})}
 }else{
   for(let r=1;r<=w.rounds;r++){out+=`<div class="round">ROUND ${r}</div>`;w.ex.forEach((ex,i)=>{out+=exerciseCard(key(r,i),ex,i+1)})}
 }
 document.getElementById("main").innerHTML=out;
}
function bonusChoice(){let yes=current.bonus===true;return `<section class="card"><div class="workoutTitle">BONUS ROUND</div><div class="muted">Continue to the bonus round?</div><div class="actions"><button class="btn ${!yes?'activeChoice':''}" onclick="setBonus(false)">No</button><button class="btn ${yes?'activeChoice':''}" onclick="setBonus(true)">Yes</button></div></section>`}
function setBonus(v){current.bonus=v;autosave();renderWorkout()}
function saveWorkout(){
 if(!Object.values(current.entries).some(e=>e.reps)){alert("Enter at least one set first.");return}
 let i=history.findIndex(w=>w.id===current.id);if(i>=0)history[i]=JSON.parse(JSON.stringify(current));else history.push(JSON.parse(JSON.stringify(current)));
 history.sort((a,b)=>new Date(a.date)-new Date(b.date));localStorage.setItem(H,JSON.stringify(history));localStorage.removeItem(C);document.getElementById("savedStatus").textContent="";alert("Workout finished and saved.");showHistory()}
function showHistory(){
 active=null;current=null;document.getElementById("saveBtn").classList.add("hidden");document.getElementById("title").textContent="History";document.getElementById("subtitle").textContent="Saved workouts";
 let sorted=[...history].sort((a,b)=>new Date(b.date)-new Date(a.date));let backup=`<section class="card"><div class="workoutTitle">Data Backup</div><div class="muted">Download a backup of your workout history, or merge one into your current history.</div><div class="actions"><button class="btn" onclick="exportData()">Export Backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Merge Backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(this.files[0])"></div></section>`;document.getElementById("main").innerHTML=backup+(sorted.length?sorted.map(w=>{
 let sets=Object.values(w.entries||{}).filter(e=>e.reps).length,name=workouts[w.workout]?.name||"Workout";
 return`<section class="card"><div class="workoutTitle">${name}</div><div class="muted">${fmtDate(w.date)} • ${sets} sets recorded</div><div class="actions"><button class="btn" onclick="editById(${w.id})">Edit</button><button class="btn danger" onclick="delById(${w.id})">Delete</button></div></section>`}).join(""):`<div class="empty">No saved workouts yet.</div>`)}
function exportData(){let data={app:"P90X Tracker",version:"3.7",exported:new Date().toISOString(),history:history,current:JSON.parse(localStorage.getItem(C)||"null")};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="p90x-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.history))throw Error();
if(!confirm(`Merge ${d.history.length} saved workouts from this backup with your current history? Existing workouts will be kept and duplicates skipped.`))return;
let added=0,skipped=0;
const sig=w=>JSON.stringify([w.id||null,w.workout||"",w.date||"",w.entries||{}]);
const existing=new Set(history.map(sig));
for(const w of d.history){let s=sig(w);if(existing.has(s)){skipped++;continue}history.push(w);existing.add(s);added++}
history.sort((a,b)=>new Date(a.date)-new Date(b.date));localStorage.setItem(H,JSON.stringify(history));
if(d.current&&!localStorage.getItem(C))localStorage.setItem(C,JSON.stringify(d.current));
alert(`Backup merged. ${added} workout${added===1?"":"s"} added${skipped?`, ${skipped} duplicate${skipped===1?"":"s"} skipped`:""}.`);showHistory()
}catch(e){alert("That file does not look like a valid P90X Tracker backup.")}};r.readAsText(file)}
function editById(id){let w=history.find(x=>x.id===id);if(w)start(w.workout,w)}
function delById(id){if(confirm("Delete this saved workout?")){history=history.filter(w=>w.id!==id);localStorage.setItem(H,JSON.stringify(history));showHistory()}}
home();
</script></body></html>
