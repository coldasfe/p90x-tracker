<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>P90X Tracker v3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0f172a}
*{box-sizing:border-box}body{margin:0;background:#0f172a}
header{position:sticky;top:0;background:#111827f2;backdrop-filter:blur(8px);padding:15px 14px 10px;border-bottom:1px solid #334155;z-index:4}
h1{font-size:22px;margin:0}.sub{color:#94a3b8;margin-top:4px}.version{color:#64748b;font-size:11px;margin-top:3px}.saved{color:#94a3b8;font-size:12px;margin-top:5px}
.wrap{max-width:680px;margin:auto;padding:12px 12px 100px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:15px;margin:10px 0}
.workoutCard{cursor:pointer}.workoutTitle{font-size:20px;font-weight:800}.muted{color:#94a3b8;font-size:13px;margin-top:4px}
.row{display:flex;gap:9px;align-items:end}.grow{flex:1}label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px}
input,select,textarea{width:100%;font-size:18px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:white;padding:10px}
textarea{font-size:15px;min-height:44px}.name{font-size:18px;font-weight:750}.last{font-size:13px;color:#94a3b8;margin:4px 0 11px}
.round{font-weight:800;color:#cbd5e1;margin:20px 3px 7px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;background:#334155;color:white}
.topBtns{display:flex;gap:8px;margin-top:12px}.save{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:656px;margin:auto;background:#f8fafc;color:#0f172a;box-shadow:0 8px 30px #0008;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:800}
.danger{background:#7f1d1d}.activeChoice{background:#f8fafc;color:#0f172a}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.empty{text-align:center;color:#94a3b8;padding:45px 20px}.hidden{display:none}
</style><meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X90 Tracker">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header><h1 id="title">P90X Tracker</h1><div class="sub" id="subtitle">Choose a workout</div><div class="version">v3.5</div><div class="saved" id="savedStatus"></div>
<div class="topBtns"><button class="btn" onclick="home()">Home</button><button class="btn" onclick="showHistory()">History</button></div></header>
<main class="wrap" id="main"></main>
<button id="saveBtn" class="save hidden" onclick="saveWorkout()">Finish Workout</button>
<script>
const workouts={
 chest_back:{name:"Chest & Back",rounds:2,ex:[
 ["Standard Push-Ups","body"],["Wide Front Pull-Ups","pull"],["Military Push-Ups","body"],["Reverse Grip Chin-Ups","pull"],
 ["Wide Fly Push-Ups","body"],["Closed Grip Overhand Pull-Ups","pull"],["Decline Push-Ups","body"],["Heavy Pants","weight"],
 ["Diamond Push-Ups","body"],["Lawnmowers","weight"],["Dive-Bomber Push-Ups","body"],["Back Flys","weight"]]},
 shoulders_arms:{name:"Shoulders & Arms",groups:[
 {label:"SET 1A",ex:[["Alternating Shoulder Presses","weight","SHOULDERS"],["In & Out Bicep Curls","weight","BICEPS"],["Two-Arm Tricep Kickbacks","weight","TRICEPS"]]},
 {label:"SET 1B",ex:[["Alternating Shoulder Presses","weight","SHOULDERS"],["In & Out Bicep Curls","weight","BICEPS"],["Two-Arm Tricep Kickbacks","weight","TRICEPS"]]},
 {label:"SET 2A",ex:[["Deep Swimmer's Presses","weight","SHOULDERS"],["Full Supination Concentration Curls","weight","BICEPS"],["Chair Dips","body","TRICEPS"]]},
 {label:"SET 2B",ex:[["Deep Swimmer's Presses","weight","SHOULDERS"],["Full Supination Concentration Curls","weight","BICEPS"],["Chair Dips","body","TRICEPS"]]},
 {label:"SET 3A",ex:[["Upright Rows","weight","SHOULDERS"],["Static Arm Curls","weight","BICEPS"],["Flip-Grip Twist Tricep Kickbacks","weight","TRICEPS"]]},
 {label:"SET 3B",ex:[["Upright Rows","weight","SHOULDERS"],["Static Arm Curls","weight","BICEPS"],["Flip-Grip Twist Tricep Kickbacks","weight","TRICEPS"]]},
 {label:"SET 4A",ex:[["Two-Angle Shoulder Flys","weight","SHOULDERS"],["Crouching Cohen Curls","weight","BICEPS"],["Lying-Down Tricep Extensions","weight","TRICEPS"]]},
 {label:"SET 4B",ex:[["Two-Angle Shoulder Flys","weight","SHOULDERS"],["Crouching Cohen Curls","weight","BICEPS"],["Lying-Down Tricep Extensions","weight","TRICEPS"]]},
 {label:"SET 5A",ex:[["In & Out Straight-Arm Shoulder Flys","weight","SHOULDERS"],["Congdon Curls","weight","BICEPS"],["Side Tri-Rises","body","TRICEPS"]]},
 {label:"SET 5B",ex:[["In & Out Straight-Arm Shoulder Flys","weight","SHOULDERS"],["Congdon Curls","weight","BICEPS"],["Side Tri-Rises","body","TRICEPS"]]}
 ],bonus:[["In & Out Straight-Arm Shoulder Flys","weight","SHOULDERS"],["Congdon Curls","weight","BICEPS"],["Side Tri-Rises","body","TRICEPS"]]},
 legs_back:{name:"Legs & Back",sequence:[
 ["Balance Lunge","weight","LEGS","reps","25 each leg",25],
 ["Calf-Raise Squat","weight","LEGS","reps",""],
 ["Reverse Grip Chin-Up","pull","BACK","reps",""],
 ["Super Skater","body","LEGS","reps","25 each side",25],
 ["Wall Squat","time","LEGS","seconds","90 sec",90],
 ["Wide Front Pull-Up","pull","BACK","reps",""],
 ["Step Back Lunge","weight","LEGS","reps","15 each side",15],
 ["Alternating Side Lunge","weight","LEGS","reps","24 reps",24],
 ["Closed Grip Overhand Pull-Up","pull","BACK","reps",""],
 ["Single-Leg Wall Squat","time","LEGS","seconds","60 sec",60],
 ["Deadlift Squat","weight","LEGS","reps","20 each leg",20],
 ["Switch Grip Pull-Up","pull","BACK","reps",""],
 ["Three-Way Lunge with Two-Kick Option","body","LEGS","reps","30 reps",30],
 ["Sneaky Lunge","body","LEGS","reps","20 reps",20],
 ["Reverse Grip Chin-Up","pull","BACK","reps",""],
 ["Chair Salutations","time","LEGS","seconds","2 reps / 30-sec hold"],
 ["Toe-Roll Iso Lunge","weight","LEGS","reps","20 each side",20],
 ["Wide Front Pull-Up","pull","BACK","reps",""],
 ["Groucho Walk","time","LEGS","seconds","45 sec",45],
 ["Calf Raises","weight","LEGS","reps","75 reps",75],
 ["Closed Grip Overhand Pull-Up","pull","BACK","reps",""],
 ["80/20 Speed Squat","body","LEGS","reps","30 reps per side",30],
 ["Switch Grip Pull-Up","pull","BACK","reps",""]
 ]} ,
 core_synergistics:{name:"Core Synergistics",sequence:[
 ["Stacked Foot/Staggered Hands Push-Up","body","CORE","reps",""],
 ["Banana Roll","body","CORE","reps","2 reps",2],
 ["Leaning Crescent Lunges","body","CORE","reps","24 reps",24],
 ["Squat Run","time","CORE","seconds","60 sec",60],
 ["Sphinx Push-Up","body","CORE","reps",""],
 ["Bow to Boat","body","CORE","reps","5 reps",5],
 ["Low Lateral Skaters","body","CORE","reps","20 reps",20],
 ["Lunge and Reach","time","CORE","seconds","120 sec",120],
 ["Prison Cell Push-Up","body","CORE","reps","8 reps",8],
 ["Side Hip Raise","body","CORE","reps","30–40 reps"],
 ["Squat X-Press","weight","CORE","reps","30 reps",30],
 ["Plank to Chaturanga Run","time","CORE","seconds","60 sec",60],
 ["Walking Push-Up","body","CORE","reps","4 reps each",4],
 ["Superman Banana","time","CORE","seconds","60 sec",60],
 ["Lunge Kickback Curl Press","weight","CORE","reps","20 reps",20],
 ["Towel Hoppers","time","CORE","seconds","60 sec",60],
 ["Ballistic Stretch","break","BREAK","seconds","45 sec"],
 ["Reach High and Under Push-Ups","body","CORE","reps","max reps"],
 ["Steam Engine","body","CORE","reps","50 reps",50],
 ["Dreya Roll","body","CORE","reps",""]
 ],bonus:[
 ["Plank to Chaturanga Iso","time","CORE","seconds","60 sec",60],
 ["Halfback","time","CORE","seconds","60 sec",60],
 ["Table Dip Leg Raise","time","CORE","seconds","60 sec",60]
 ]}
};
const H="p90x_v3_history", C="p90x_v3_current";
let old=JSON.parse(localStorage.getItem("p90x_v2_history")||"[]");
let history=JSON.parse(localStorage.getItem(H)||"null")||old.map(w=>({...w,workout:w.workout||"chest_back"}));
localStorage.setItem(H,JSON.stringify(history));
let current=null, active=null;
function fresh(id){return{id:Date.now(),workout:id,date:new Date().toISOString(),entries:{}}}
function fmtDate(x){return new Date(x).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
function priorFor(workoutId,k,date,id){
 return history.filter(w=>w.workout===workoutId && w.id!==id && new Date(w.date)<new Date(date) && w.entries?.[k]?.reps)
 .sort((a,b)=>new Date(b.date)-new Date(a.date))[0]?.entries[k]||null}
function desc(e){if(!e)return"—";let a=[];if(e.weight)a.push(e.weight+" lb");if(e.reps)a.push(e.reps+" reps");if(e.mod&&e.mod!=="Standard"&&e.mod!=="None")a.push(e.mod);return a.length?a.join(" × "):"—"}
function home(){
 active=null;current=null;document.getElementById("saveBtn").classList.add("hidden");document.getElementById("title").textContent="P90X Tracker";document.getElementById("subtitle").textContent="Choose a workout";
 let cards=Object.entries(workouts).map(([id,w])=>{let detail=w.sequence?`${w.sequence.length} exercises`:w.groups?`${w.groups.length} sets • ${w.groups.reduce((n,g)=>n+g.ex.length,0)} tracked entries`:`${w.rounds} rounds • ${w.ex.length*w.rounds} tracked sets`;return`<section class="card workoutCard" onclick="start('${id}')"><div class="workoutTitle">${w.name}</div><div class="muted">${detail}</div></section>`}).join("");let draft=JSON.parse(localStorage.getItem(C)||"null");if(draft&&workouts[draft.workout]){let n=Object.keys(draft.entries||{}).length;cards=`<section class="card workoutCard" onclick="start('${draft.workout}',JSON.parse(localStorage.getItem(C)))"><div class="workoutTitle">Resume ${workouts[draft.workout].name}</div><div class="muted">${n} entries autosaved • ${fmtDate(draft.date)}</div></section>`+cards}document.getElementById("main").innerHTML=cards}
function start(id,existing=null){
 let draft=JSON.parse(localStorage.getItem(C)||"null");
 if(!existing&&draft&&Object.keys(draft.entries||{}).length&&!confirm("An unfinished workout is autosaved. Start a new workout and replace it?"))return;
 active=id;current=existing?JSON.parse(JSON.stringify(existing)):fresh(id);localStorage.setItem(C,JSON.stringify(current));document.getElementById("savedStatus").textContent="✓ Autosave on";renderWorkout()}
function key(r,i){return`${r}-${i}`}
function setv(k,f,v){current.entries[k]=current.entries[k]||{};current.entries[k][f]=v;autosave()}
function autosave(){localStorage.setItem(C,JSON.stringify(current));let s=document.getElementById("savedStatus");s.textContent="✓ Saved";clearTimeout(window._st);window._st=setTimeout(()=>s.textContent="✓ Autosave on",1500)}
function exerciseCard(k,ex,num){
 let e=current.entries[k]||{},last=priorFor(active,k,current.date,current.id),type=ex[1],cat=ex[2]||"",metric=ex[3]||"reps",hint=ex[4]||"",def=ex[5];
 if(def!==undefined&&(e.reps===undefined||e.reps==="")){e.reps=String(def);current.entries[k]=e;autosave()}
 let out=`<section class="card">${cat?`<div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#94a3b8;margin-bottom:4px">${cat}</div>`:""}<div class="name">${num}. ${ex[0]}</div>${hint?`<div class="muted">${hint}</div>`:""}<div class="last">Last time: ${desc(last)}</div><div class="row">`;
 if(type==="weight")out+=`<div class="grow"><label>Weight (lb)</label><input inputmode="decimal" value="${e.weight||""}" onchange="setv('${k}','weight',this.value)"></div>`;
 if(metric==="seconds") out+=`<div class="grow"><label>Seconds</label><input inputmode="numeric" value="${e.reps||""}" onchange="setv('${k}','reps',this.value)"></div>`;
 else out+=`<div class="grow"><label>Reps</label><input inputmode="numeric" value="${e.reps||""}" onchange="setv('${k}','reps',this.value)"></div>`;
 if(type==="pull")out+=`<div class="grow"><label>Assistance</label><select onchange="setv('${k}','mod',this.value)">${["None","Chair","Band"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
 if(type==="body")out+=`<div class="grow"><label>Style</label><select onchange="setv('${k}','mod',this.value)">${["Standard","Modified"].map(v=>`<option ${e.mod===v?"selected":""}>${v}</option>`).join("")}</select></div>`;
 out+=`</div><div style="margin-top:9px"><label>Quick note</label><textarea placeholder="Optional…" onchange="setv('${k}','note',this.value)">${e.note||""}</textarea></div></section>`;
 return out;
}
function renderWorkout(){
 let w=workouts[active];document.getElementById("title").textContent=w.name;document.getElementById("subtitle").textContent=fmtDate(current.date);document.getElementById("saveBtn").classList.remove("hidden");let out="";
 if(w.sequence){
   w.sequence.forEach((ex,i)=>{out+=exerciseCard(`s-${i}`,ex,i+1)});
 }else if(w.groups){
   w.groups.forEach((g,gi)=>{out+=`<div class="round">${g.label}</div>`;g.ex.forEach((ex,i)=>{out+=exerciseCard(`g${gi}-${i}`,ex,i+1)})});
   if(w.bonus){let yes=current.bonus===true;out+=`<section class="card"><div class="workoutTitle">BONUS ROUND</div><div class="muted">Doing the bonus round?</div><div class="actions"><button class="btn ${!yes?'activeChoice':''}" onclick="setBonus(false)">No</button><button class="btn ${yes?'activeChoice':''}" onclick="setBonus(true)">Yes</button></div></section>`;if(yes){out+=`<div class="round">BONUS ROUND</div>`;w.bonus.forEach((ex,i)=>out+=exerciseCard(`bonus-${i}`,ex,i+1))}}
 }else{
   for(let r=1;r<=w.rounds;r++){out+=`<div class="round">ROUND ${r}</div>`;w.ex.forEach((ex,i)=>{out+=exerciseCard(key(r,i),ex,i+1)})}
 }
 document.getElementById("main").innerHTML=out;
}
function setBonus(v){current.bonus=v;autosave();renderWorkout()}
function saveWorkout(){
 if(!Object.values(current.entries).some(e=>e.reps)){alert("Enter at least one set first.");return}
 let i=history.findIndex(w=>w.id===current.id);if(i>=0)history[i]=JSON.parse(JSON.stringify(current));else history.push(JSON.parse(JSON.stringify(current)));
 history.sort((a,b)=>new Date(a.date)-new Date(b.date));localStorage.setItem(H,JSON.stringify(history));localStorage.removeItem(C);document.getElementById("savedStatus").textContent="";alert("Workout finished and saved.");showHistory()}
function showHistory(){
 active=null;current=null;document.getElementById("saveBtn").classList.add("hidden");document.getElementById("title").textContent="History";document.getElementById("subtitle").textContent="Saved workouts";
 let sorted=[...history].sort((a,b)=>new Date(b.date)-new Date(a.date));let backup=`<section class="card"><div class="workoutTitle">Data Backup</div><div class="muted">Download a backup of your workout history, or restore one later.</div><div class="actions"><button class="btn" onclick="exportData()">Export Backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Restore Backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(this.files[0])"></div></section>`;document.getElementById("main").innerHTML=backup+(sorted.length?sorted.map(w=>{
 let sets=Object.values(w.entries||{}).filter(e=>e.reps).length,name=workouts[w.workout]?.name||"Workout";
 return`<section class="card"><div class="workoutTitle">${name}</div><div class="muted">${fmtDate(w.date)} • ${sets} sets recorded</div><div class="actions"><button class="btn" onclick="editById(${w.id})">Edit</button><button class="btn danger" onclick="delById(${w.id})">Delete</button></div></section>`}).join(""):`<div class="empty">No saved workouts yet.</div>`)}
function exportData(){let data={app:"P90X Tracker",version:"3.4",exported:new Date().toISOString(),history:history,current:JSON.parse(localStorage.getItem(C)||"null")};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="p90x-tracker-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.history))throw Error();if(!confirm(`Restore ${d.history.length} saved workouts from this backup? This replaces current history.`))return;history=d.history;localStorage.setItem(H,JSON.stringify(history));if(d.current)localStorage.setItem(C,JSON.stringify(d.current));else localStorage.removeItem(C);alert("Backup restored.");showHistory()}catch(e){alert("That file does not look like a valid P90X Tracker backup.")}};r.readAsText(file)}
function editById(id){let w=history.find(x=>x.id===id);if(w)start(w.workout,w)}
function delById(id){if(confirm("Delete this saved workout?")){history=history.filter(w=>w.id!==id);localStorage.setItem(H,JSON.stringify(history));showHistory()}}
home();
</script></body></html>
